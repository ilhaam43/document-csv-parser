<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report 2 Ongoing Parser</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <p class="eyebrow">Ongoing tracking workbook generator</p>
        <h1>Report 2 Ongoing Parser</h1>
        <code>Powered by csv_to_excel_on_going.py</code>
      </div>
      <div class="health" id="health">API status: checking</div>
    </header>

    <div class="workspace">
      <section class="upload-panel">
        <div class="panel-heading">
          <h2>Upload Ongoing Files</h2>
          <p>Generate the outgoing workbook from the tracking workbook and status log CSV.</p>
        </div>
        <form id="upload-form">
          <div class="field">
            <label for="tracking_workbook">Daily Tracking Excel</label>
            <input id="tracking_workbook" name="tracking_workbook" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required>
          </div>

          <div class="field">
            <label for="log_update_status">Log Update Status CSV</label>
            <input id="log_update_status" name="log_update_status" type="file" accept=".csv,text/csv" required>
          </div>

          <label class="option">
            <input id="with_pivot" name="with_pivot" type="checkbox" checked>
            <span>Refresh ongoing pivots</span>
          </label>

          <button id="submit-button" type="submit">Generate Ongoing Workbook</button>
        </form>
      </section>

      <aside class="status">
        <div class="panel-heading">
          <h2>Status</h2>
          <p>Conversion progress and download link.</p>
        </div>
        <div id="status-box" class="status-box">Ready.</div>
        <a id="download-link" class="download" href="#">Download Workbook</a>
      </aside>
    </div>
  </main>

  <script src="/static/report-2.js"></script>
</body>
</html>
